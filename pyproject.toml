[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compsognathus"
version = "1.3.1"
description = "Generic plugin-based web scraper CLI — extract structured data from any site"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ely Barros"}]
keywords = ["scraping", "web-scraping", "cli", "playwright", "data-extraction", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "playwright>=1.44",
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "rich>=13.7",
    "typer>=0.12",
    "tenacity>=8.3",
]

# PLUGIN HOOK: instalar dependências opcionais de desenvolvimento
[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

# Dois entry points: nome curto (comps) e nome completo (compsognathus)
[project.scripts]
comps = "compsognathus.cli:app"
compsognathus = "compsognathus.cli:app"

[tool.setuptools.packages.find]
include = ["compsognathus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
